# Las tasas de referencia del cotizador, una vez al día (ADR-0019).
#
# Trae las tasas, y si cambiaron hace un commit a `main` con
# `src/lib/pricing/tasas.json`. Ese push dispara el despliegue de Cloudflare
# que ya existe: este archivo no despliega nada por su cuenta.
#
# Horario, en UTC, que es como lo lee GitHub: 10:17. En Chile son las 07:17
# con el horario de verano (UTC−3) y las 06:17 con el de invierno (UTC−4).
#
# **El minuto 17 es a propósito.** GitHub advierte que con mucha carga atrasa
# o DESCARTA ejecuciones programadas, sobre todo al comienzo de cada hora. La
# primera, a las 10:00 en punto, el 2026-11-11, no se lanzó.
#
# GitHub puede atrasar una ejecución programada varios minutos, y eso da igual:
# la fuente gratuita cambia una vez al día, hacia las 21:00 de Chile, así que a
# esa hora la tasa del día ya está. Si una mañana falla, se puede correr a mano
# desde la pestaña Actions («Run workflow»).
#
# Sin credenciales: usa el `GITHUB_TOKEN` que GitHub da a cada ejecución,
# limitado a este repositorio y a escribir su contenido.
name: Tasas de referencia

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tasas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Sin `actions/setup-node`: el servidor de GitHub ya trae Node, y el
      # script sólo necesita `fetch`, que está desde Node 18. Una pieza menos
      # que se quede vieja (2026-11-10: la v4 de las dos avisaba que corría en
      # un Node retirado).
      - name: Traer las tasas
        run: |
          node --version
          node scripts/actualizar-tasas.mjs

      - name: Commit, si cambiaron
        run: |
          if git diff --quiet -- src/lib/pricing/tasas.json; then
            echo "Sin cambios: no hay commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/pricing/tasas.json
          git commit -m "chore(tasas): tasas de referencia del $(date -u +%Y-%m-%d)"
          git push
